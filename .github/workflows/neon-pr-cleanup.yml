name: Delete Neon branch for closed PR

# WHY THIS EXISTS, and what it cost to find out.
#
# Preview DB branches used to come from the Vercel–Neon integration, which
# provisioned a branch per preview and NEVER removed it. Once the project hit
# its branch quota, Neon stopped issuing new ones and Vercel rejected the
# preview deployment IN ABOUT ONE SECOND — three red checks, production fine,
# code fine. The distinguishing signal is the CLOCK (real build = minutes).
#
# We no longer use the integration for this monorepo (three Vercel apps, one
# Neon project). neon-pr-preview.yml creates `preview/<head-ref>` and sets
# git-branch-scoped Preview DATABASE_* on all three apps. This workflow still
# deletes the Neon branch on PR close, and also removes those Vercel env rows
# so they do not accumulate forever.
#
# ## Naming
#
# Preview branches are named:
#
#     preview/<head-branch-name>
#
# We look these up by PREFIX rather than reconstructing the full name from event
# data — head-ref slugging can differ, so a prefix match is more robust while
# staying narrowly scoped to this PR. (It does mean a branch named `feat-a` would
# also match `preview/feat-a-b`; keep branch names distinct, which they are.)

# `pull_request_target` (not `pull_request`) so the base repository's Actions
# secret store is available even when the PR was opened or closed by Dependabot
# or from a fork. Under `pull_request`, a Dependabot-actor close gets the empty
# Dependabot secret store, NEON_API_KEY resolves to nothing, and the job fails
# before deleting anything — leaking the branch it exists to remove.
#
# This is safe here, and the reason is worth stating because `pull_request_target`
# is normally a red flag: this job checks out NO PR CODE. It reads event metadata
# and calls the Neon REST API. There is no untrusted-code surface for a fork to
# reach the secrets through.
on:
  pull_request_target:
    types: [closed]

# Least privilege — this job never writes to the repository.
permissions:
  contents: read

jobs:
  delete-neon-branch:
    # Only same-repo PRs get a `preview/<head-branch>` Neon branch, so scope
    # cleanup to those. Fork PRs have nothing to delete, and skipping them keeps
    # the pull_request_target blast radius minimal.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch for this PR
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${NEON_PROJECT_ID:-}" ]; then
            echo "::error::NEON_API_KEY or NEON_PROJECT_ID is empty"
            exit 1
          fi

          prefix="preview/${HEAD_REF}"
          echo "Looking up Neon branches with prefix: $prefix"

          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          auth="Authorization: Bearer ${NEON_API_KEY}"

          # Bounded timeouts + bounded retries: transient hangs and 5xx get
          # retried, client errors do not (which is why --retry-all-errors is
          # deliberately absent).
          curl_opts=(--connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5)

          # Page through ALL branches (cursor-based; follow pagination.next).
          # Without this, an over-quota project with enough branches to span
          # multiple pages could hide the target beyond the first page — a false
          # "nothing to delete" and a silent leak, on exactly the project where
          # the leak matters most.
          all_branches='[]'
          cursor=""
          while :; do
            url="$api/branches?limit=10000"
            if [ -n "$cursor" ]; then
              url="${url}&cursor=${cursor}"
            fi
            resp=$(curl -sS "${curl_opts[@]}" -w "\n%{http_code}" -H "$auth" -H "Accept: application/json" "$url")
            body=$(printf '%s' "$resp" | sed '$d')
            status=$(printf '%s' "$resp" | tail -n1)
            if [ "$status" != "200" ]; then
              echo "::error::Neon API returned HTTP $status when listing branches"
              echo "$body"
              exit 1
            fi
            all_branches=$(jq -n --argjson acc "$all_branches" --argjson page "$body" '$acc + ($page.branches // [])')
            cursor=$(printf '%s' "$body" | jq -r '.pagination.next // empty')
            if [ -z "$cursor" ]; then
              break
            fi
          done

          # Non-primary branches matching this PR's prefix. `primary != true` is
          # the guard that matters most in this repository: the primary branch is
          # PRODUCTION, holding real burners' registrations, and it must never be
          # a candidate for deletion under any circumstance.
          targets=$(printf '%s' "$all_branches" | jq -r --arg prefix "$prefix" '
            .[]
            | select(.primary != true)
            | select(.name | startswith($prefix))
            | [.id, .name] | @tsv
          ')

          if [ -z "$targets" ]; then
            echo "No Neon branch found for PR #${PR_NUMBER} (prefix: $prefix). Nothing to delete."
          else
            # In practice there is exactly one match per PR; the loop is defensive
            # in case an earlier failed run left duplicates behind.
            while IFS=$'\t' read -r id name; do
              [ -z "$id" ] && continue
              echo "Deleting branch: $name (id=$id)"
              del_status=$(curl -sS "${curl_opts[@]}" -o /dev/null -w "%{http_code}" -X DELETE -H "$auth" "$api/branches/$id")
              if [ "$del_status" = "200" ] || [ "$del_status" = "202" ]; then
                echo "  ok"
              else
                echo "::error::Failed to delete $name (HTTP $del_status)"
                exit 1
              fi
            done <<< "$targets"
          fi

      - name: Delete git-branch-scoped Vercel Preview DATABASE_* env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_IDS: ${{ secrets.VERCEL_PROJECT_IDS }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_IDS:-}" ]; then
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_IDS not set — skipping Vercel env cleanup"
            exit 0
          fi

          curl_opts=(--connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5)
          auth=( -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Accept: application/json" )
          api="https://api.vercel.com"

          IFS=',' read -r -a project_ids <<< "$VERCEL_PROJECT_IDS"
          for project_id in "${project_ids[@]}"; do
            project_id="$(echo "$project_id" | tr -d '[:space:]')"
            [ -z "$project_id" ] && continue
            echo "Scanning env on ${project_id} for gitBranch=${HEAD_REF}"
            list=$(curl -sS "${curl_opts[@]}" "${auth[@]}" \
              "${api}/v9/projects/${project_id}/env?teamId=${VERCEL_ORG_ID}")
            ids=$(printf '%s' "$list" | jq -r --arg branch "$HEAD_REF" '
              .envs[]?
              | select(.key == "DATABASE_URL" or .key == "DATABASE_URL_UNPOOLED")
              | select((.target // []) | index("preview"))
              | select((.gitBranch // "") == $branch)
              | .id
            ')
            if [ -z "$ids" ]; then
              echo "  none"
              continue
            fi
            while IFS= read -r eid; do
              [ -z "$eid" ] && continue
              echo "  deleting env id=${eid}"
              code=$(curl -sS "${curl_opts[@]}" "${auth[@]}" -o /dev/null -w "%{http_code}" -X DELETE \
                "${api}/v9/projects/${project_id}/env/${eid}?teamId=${VERCEL_ORG_ID}")
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                echo "    ok"
              else
                echo "::warning::delete env ${eid} returned HTTP ${code}"
              fi
            done <<< "$ids"
          done
