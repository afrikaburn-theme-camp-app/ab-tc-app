version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Align version-update PRs with Aikido Safe Chain's 48h minimum package
    # age (`.aikido` + threat model C6). Dependabot only accepts whole days
    # (1–90), so 2 ≈ 48h. Security-update PRs ignore cooldown and still open
    # immediately. Cooldown applies to the direct dependency being bumped;
    # young transitives pulled into the lockfile are still caught by Safe
    # Chain on CI install.
    cooldown:
      default-days: 2
    # commitlint's scope enum is workspace names + `repo` — not Dependabot's
    # default `deps` / `deps-dev`. Prefix with `chore(repo)` and leave
    # `include: scope` off so titles pass CI without diluting SCOPES.
    commit-message:
      prefix: "chore(repo)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # `better-auth` is pinned to an exact version deliberately (SECURITY.md,
    # AGENTS.md pins list) — it has a track record of high-severity auth
    # advisories and every bump needs a manual security read-through before
    # merge, not an automated one. `@radix-ui/react-slot` is pinned because a
    # newer version breaks typecheck/build. Review both manually.
    ignore:
      - dependency-name: "better-auth"
      - dependency-name: "@radix-ui/react-slot"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore(repo)"
